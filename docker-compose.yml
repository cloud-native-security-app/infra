services:
  # --- Dependencias de infraestructura ---------------------------------

  # SNS + SQS locales (reemplazan al broker anterior). El hook de init crea la misma
  # topología que terraform/messaging.tf; el healthcheck solo pasa cuando el
  # hook terminó (marca /tmp/localstack-init.done), así que `service_healthy`
  # significa "topics y colas existen".
  localstack:
    image: localstack/localstack:4.4
    ports:
      - "4566:4566"
    environment:
      SERVICES: sns,sqs
      AWS_DEFAULT_REGION: us-east-1
      # El hook calcula el visibility timeout de la cola de solicitudes con
      # los mismos timeouts SSH que recibe nmap-service.
      SCAN_SSH_CONNECT_TIMEOUT_SECS: "10"
      SCAN_SSH_COMMAND_TIMEOUT_SECS: "${SCAN_SSH_COMMAND_TIMEOUT_SECS:-300}"
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/localstack-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/localstack-init.done && curl -sf http://localhost:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: usuarios
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Servicios de la plataforma ---------------------------------------

  user-service:
    build: ../user-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:devpassword@postgres:5432/usuarios
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      GATEWAY_SHARED_SECRET: dev-shared-secret
      # Clave de cifrado en reposo de las credenciales de red (feature
      # network_credentials_api): 32 bytes, hex de 64 caracteres — SOLO para
      # laboratorio, como el resto de secretos de este compose.
      CREDENTIALS_ENCRYPTION_KEY: "0707070707070707070707070707070707070707070707070707070707070707"
    ports:
      - "8081:8080"

  nmap-service:
    build: ../nmap-service
    depends_on:
      mongo:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      MS_NMAP_MONGO_URI: "mongodb://mongo:27017/?directConnection=true"
      MS_NMAP_MONGO_DB: db-nmap
      MS_NMAP_SSH_PORT: "22"
      MS_NMAP_SSH_CONNECT_TIMEOUT_SECS: "10"
      MS_NMAP_SSH_COMMAND_TIMEOUT_SECS: "${SCAN_SSH_COMMAND_TIMEOUT_SECS:-300}"
      MS_NMAP_NVD_ENRICHMENT_ENABLED: "false"
      # Mensajería SNS + SQS contra LocalStack. `AWS_ENDPOINT_URL` redirige el
      # SDK; las credenciales son ficticias (LocalStack no las valida). Las
      # URLs/ARNs son estáticas: cuenta 000000000000, región us-east-1.
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: "http://localstack:4566"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      MS_NMAP_SCAN_REQUESTS_QUEUE_URL: "http://localstack:4566/000000000000/ms-nmap-scan-requests"
      MS_NMAP_SCAN_REQUESTS_DLQ_URL: "http://localstack:4566/000000000000/ms-nmap-scan-requests-dlq"
      MS_NMAP_SCAN_CANCELLATIONS_QUEUE_URL: "http://localstack:4566/000000000000/ms-nmap-scan-cancellations"
      MS_NMAP_SCAN_CANCELLATIONS_DLQ_URL: "http://localstack:4566/000000000000/ms-nmap-scan-cancellations-dlq"
      MS_NMAP_SCAN_OUTCOMES_TOPIC_ARN: "arn:aws:sns:us-east-1:000000000000:scan-outcomes"

  gateway:
    build: ../gateway
    depends_on:
      localstack:
        condition: service_healthy
      user-service:
        condition: service_started
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      # Placeholders: sin credenciales Google reales el login no completa
      # (ver START.md, "Huecos conocidos"). El resto del wiring OIDC sí se
      # puede observar (GET /auth/login redirige a Google).
      GOOGLE_CLIENT_ID: dev-placeholder
      GOOGLE_CLIENT_SECRET: dev-placeholder
      GOOGLE_REDIRECT_URI: "http://localhost:8080/auth/callback"
      # Adonde redirige /auth/callback tras emitir la sesión (feature
      # post_login_redirect) — el puerto host de `front` en este compose.
      FRONT_BASE_URL: "http://localhost:8082"
      SESSION_SIGNING_KEY: dev-signing-key-not-for-prod
      SESSION_TTL_SECS: "3600"
      # Mensajería SNS + SQS contra LocalStack (ver el bloque de nmap-service).
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: "http://localstack:4566"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SCAN_REQUESTS_TOPIC_ARN: "arn:aws:sns:us-east-1:000000000000:scan-requests"
      SCAN_CANCELLATIONS_TOPIC_ARN: "arn:aws:sns:us-east-1:000000000000:scan-cancellations"
      GATEWAY_SCAN_OUTCOMES_QUEUE_URL: "http://localstack:4566/000000000000/gateway-scan-outcomes"
      GATEWAY_SCAN_OUTCOMES_DLQ_URL: "http://localstack:4566/000000000000/gateway-scan-outcomes-dlq"
      MS_USUARIOS_BASE_URL: "http://user-service:8080"
      MS_USUARIOS_SHARED_SECRET: dev-shared-secret
      SCAN_SUBMISSION_RATE_LIMIT_MAX_REQUESTS: "5"
      SCAN_SUBMISSION_RATE_LIMIT_WINDOW_SECS: "60"
    ports:
      - "8080:8080"

  front:
    build:
      context: ../front
      args:
        # URL vista desde el NAVEGADOR del host (no el nombre de servicio
        # Docker `gateway`) — se hornea en el JS en build-time y parametriza
        # la CSP (front/nginx.conf.template). Si cambias el puerto host de
        # gateway, hay que reconstruir esta imagen.
        VITE_GATEWAY_BASE_URL: "http://localhost:8080"
    depends_on:
      - gateway
    ports:
      - "8082:8080"
